name: Monitor Bot

on:
  schedule:
    - cron: '2,17,32,47 * * * *'  # كل 15 دقيقة - عدّل حسب حاجتك
  workflow_dispatch:  

permissions:
  contents: write  

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u monitor.py

      - name: Upload debug snapshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-snapshots
          path: |
            debug_*.png
            debug_*.html
          if-no-files-found: ignore

      - name: Commit updated sent.txt
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add sent.txt
          if git diff --staged --quiet; then
            echo "No new items to commit."
          else
            git commit -m "Update sent items"
            git pull --rebase origin main
            git push
          fi
