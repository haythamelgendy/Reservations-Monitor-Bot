name: Monitor Bot

on:
  schedule:
    # Same UTC minutes: 02, 17, 32, 47. Reassign the scheduler actor.
    - cron: '2-59/15 * * * *'
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Send one Telegram delivery test'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: reservations-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify alert behavior
        env:
          TELEGRAM_TOKEN: test-token
          TELEGRAM_CHAT_ID: test-chat
        run: python -m unittest -v test_monitor
      - name: Run monitor script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.telegram_test }}
          RUN_EVENT: ${{ github.event_name }}
        run: python -u monitor.py
      - name: Upload debug snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-snapshots
          path: |
            debug_*.png
            debug_*.html
          if-no-files-found: ignore
      - name: Persist confirmed notifications
        if: always()
        run: |
          test -f sent.txt || exit 0
          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'
          git add sent.txt
          if ! git diff --staged --quiet; then
            git commit -m 'Update confirmed sent items'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
